[package]
name = "trinethra-app"
version = "2.0.0"
description = "TRINETHRA National Intelligent Traffic Management & Surveillance Grid"
authors = ["Ministry of Road Transport & Highways, Government of India"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["dialog-all", "fs-all", "http-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
